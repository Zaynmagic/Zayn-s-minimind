name: CPU checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check training stages
        run: >-
          python -m training.run --steps 2
          --reward synthetic_token_distance --allow-random-teacher --output runs/ci
      - name: Check exported model
        run: >-
          python -m training.evaluate --model runs/ci/hf
          --data data/synthetic/eval.jsonl --output runs/ci/evaluation.json
      - name: Check distributed training
        run: >-
          python -m torch.distributed.run --standalone --nproc_per_node=2
          -m training.run --stages pretrain,sft,moe --steps 3
          --accumulation 2 --output runs/ci-ddp
