name: CPU checks
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m training.run --steps 2 --reward synthetic_token_distance --allow-random-teacher --output runs/ci
      - run: python -m training.evaluate --model runs/ci/hf --data data/synthetic/eval.jsonl --output runs/ci/evaluation.json
      - run: python -m torch.distributed.run --standalone --nproc_per_node=2 -m training.run --stages pretrain,sft,moe --steps 3 --accumulation 2 --output runs/ci-ddp
